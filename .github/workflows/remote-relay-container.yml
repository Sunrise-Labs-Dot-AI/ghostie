name: Remote relay container
on:
  pull_request:
    paths: ['mcps/remote-relay/**', '.github/workflows/remote-relay-container.yml']
  push:
    branches: [main]
    paths: ['mcps/remote-relay/**', '.github/workflows/remote-relay-container.yml']
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: docker build -t ghostie-relay:local mcps/remote-relay
      - run: bun run mcps/remote-relay/tests/container-smoke.ts
