name: railway-probe
on:
  pull_request:
    paths:
      - 'tests/remote-tunnel/**'
      - '.github/workflows/railway-probe.yml'
  push:
    branches: [main]
    paths:
      - 'tests/remote-tunnel/**'
      - '.github/workflows/railway-probe.yml'
permissions:
  contents: read
jobs:
  synthetic-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tests/remote-tunnel
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
